name: Set up mg-utils PHP
description: Install PHP with Xdebug and resolve dev dependencies for that PHP version.
inputs:
  php-version:
    description: PHP version
    default: '8.3'
runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ inputs.php-version }}
        coverage: xdebug
        tools: composer:v2
    # Library convention: no composer.lock, so each PHP version resolves compatible tools.
    - shell: bash
      run: composer update --no-interaction --no-progress --prefer-dist
