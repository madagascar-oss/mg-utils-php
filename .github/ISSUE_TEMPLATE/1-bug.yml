name: Bug report
description: Wrong output or a crash
labels: [bug, triage]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - phone
        - words
        - ariary
        - date
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Package and PHP version
      placeholder: "mdgascar/mdg-utils 0.2.0, PHP 8.4"
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The exact call, e.g. `parsePhoneNumber('034 12 345 67')`.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected output
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output or error
    validations:
      required: true
