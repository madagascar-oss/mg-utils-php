# Fix PHP style and lint YAML on staged files before each commit. Installed by `just setup`.
pre-commit:
  commands:
    php-cs-fixer:
      glob: "*.php"
      run: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php {staged_files}
      stage_fixed: true
    yamllint:
      glob: "*.{yaml,yml}"
      run: yamllint -c .yamllint.yaml {staged_files} || echo "yamllint not installed; CI will check YAML"
commit-msg:
  commands:
    conventional:
      run: >-
        grep -Eq '^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert)(\([a-z0-9-]+\))?!?: .+' {1}
        || (echo "Commit title must follow Conventional Commits, e.g. feat(phone): add prefix 37" && exit 1)
