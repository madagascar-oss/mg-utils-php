# Fix PHP style on staged files before each commit. Install with `npx lefthook install`.
pre-commit:
  commands:
    php-cs-fixer:
      glob: '*.php'
      run: vendor/bin/php-cs-fixer fix {staged_files}
      stage_fixed: true
commit-msg:
  commands:
    conventional:
      run: >-
        grep -Eq '^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert)(\([a-z0-9-]+\))?!?: .+' {1}
        || (echo "Commit title must follow Conventional Commits, e.g. feat(phone): add prefix 37" && exit 1)
